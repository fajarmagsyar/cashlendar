<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174f3e"><title>Offline · Cashlendar</title><style>body{margin:0;background:#f7f8f5;color:#1d2e26;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}main{max-width:400px;padding:32px}strong{color:#174f3e;font-size:24px}h1{font-size:40px;letter-spacing:-1.5px}p{color:#526359;line-height:1.7}a{display:inline-block;background:#174f3e;color:white;padding:14px 22px;border-radius:8px;text-decoration:none}a:focus-visible{outline:3px solid #b77221;outline-offset:4px}</style></head><body><main id="main"><strong>Cashlendar.</strong><h1>Hubungkan<br>kembali.</h1><p>Anda sedang offline. Sambungkan internet untuk melihat keuangan keluarga dan menyimpan transaksi. Data keuangan Anda tidak disimpan di cache offline.</p><a href="/">Coba lagi</a></main><script>if(document.cookie.split(';').some(value=>value.trim()==='cashlendar-language=en')){document.documentElement.lang='en';document.querySelector('h1').innerHTML='A moment<br>to reconnect.';document.querySelector('p').textContent='You’re offline. Reconnect to view your household and save transactions. Your financial data is not stored in the offline cache.';document.querySelector('a').textContent='Try again';}</script></body></html>
